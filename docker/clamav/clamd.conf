# clamd для PravoOS. Монтируется read-only в clamav-контейнер.
# Лимиты согласованы с document.upload-guard.max-file-bytes (50 МБ) в ai-service:
# StreamMaxLength должен быть заведомо больше, иначе clamd рвёт соединение на больших
# загрузках и fail-closed отклоняет легитимный файл.

DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp

TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock

Foreground yes
LogTime yes
LogClean no
LogSyslog no

MaxThreads 4
MaxQueue 50
ReadTimeout 60
CommandReadTimeout 30
ExitOnOOM yes
# Перезагрузка баз без удвоения памяти — VPS маленький.
ConcurrentDatabaseReload no

StreamMaxLength 64M
MaxFileSize 64M
MaxScanSize 400M
MaxScanTime 60000
MaxRecursion 12
MaxFiles 10000

ScanPDF yes
ScanOLE2 yes
ScanArchive yes
ScanHTML yes
ScanSWF yes
ScanXMLDOCS yes

AlertOLE2Macros yes
AlertEncryptedArchive yes
# AlertEncryptedDoc намеренно off: юристы легитимно присылают PDF под паролем,
# он всё равно не пройдёт парсинг текста — но и «вирусом» его звать нельзя.
AlertEncryptedDoc no
AlertBrokenExecutables yes
AlertPartitionIntersection yes
HeuristicAlerts yes
