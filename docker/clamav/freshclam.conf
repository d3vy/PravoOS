# freshclam (авто-обновление сигнатур) для PravoOS. Монтируется read-only.
# Число проверок в сутки контейнер передаёт флагом --checks (FRESHCLAM_CHECKS),
# он приоритетнее директивы Checks ниже.

DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
Checks 24

# Инкрементальные диффы вместо полной базы — иначе каждое обновление тянет ~250 МБ.
ScriptedUpdates yes
TestDatabases yes
CompressLocalDatabase no

# Свежая база сразу подхватывается работающим clamd, без рестарта контейнера.
NotifyClamd /etc/clamav/clamd.conf

ConnectTimeout 30
ReceiveTimeout 60
MaxAttempts 3
LogTime yes
LogVerbose no
