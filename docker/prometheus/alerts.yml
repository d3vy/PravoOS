groups:
  - name: pravoos-availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Сервис {{ $labels.service }} недоступен"
          description: "{{ $labels.job }} не отвечает на scrape более 2 минут."

      - alert: HighHttp5xxRate
        expr: sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Высокий уровень 5xx в {{ $labels.service }}"
          description: "> 1 ошибки 5xx в секунду последние 5 минут."

      - alert: HighRequestLatencyP99
        expr: histogram_quantile(0.99, sum by (service, le) (rate(http_server_requests_seconds_bucket[5m]))) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Высокая задержка p99 в {{ $labels.service }}"
          description: "p99 латентность HTTP-запросов выше 3с последние 10 минут."

  - name: pravoos-app
    rules:
      - alert: KafkaDeadLetterMessages
        expr: increase(pravoos_kafka_dlt_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Сообщения попали в DLT: {{ $labels.topic }}"
          description: "За 10 минут в DLT-топик {{ $labels.topic }} попали сообщения — требуется разбор."

      - alert: DocumentProcessingFailing
        expr: increase(pravoos_document_processing_total{result="failed"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Документы не проходят обработку (embedding pipeline)"
          description: "За 15 минут были провалы обработки загруженных документов — они остаются в статусе FAILED и не попадают в RAG. Проверь OpenAI embeddings и парсинг файлов."

      - alert: MalwareScannerDegraded
        expr: increase(pravoos_document_malware_total{result=~"error|stale-signatures"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Антивирус не сканирует загрузки ({{ $labels.result }})"
          description: "За 15 минут clamd был недоступен, вернул ошибку или работал на устаревших базах. При fail-closed юристы не могут загружать документы. Проверь контейнер clamav и freshclam."

      - alert: MalwareSignaturesStale
        expr: pravoos_document_malware_signature_age_days > 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Базы ClamAV не обновлялись {{ $value }} дней"
          description: "freshclam не приносит свежие сигнатуры. На 7 днях загрузки начнут отклоняться (CLAMAV_MAX_SIGNATURE_AGE_DAYS)."

      - alert: MalwareDetectedInUploads
        expr: increase(pravoos_document_malware_total{result="infected"}[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Антивирус заблокировал заражённую загрузку"
          description: "За час clamd нашёл вредоносное содержимое в загружаемом документе — файл отклонён. Стоит посмотреть, чей аккаунт и что грузил."

      - alert: LoginFailureSpike
        expr: sum(rate(pravoos_login_total{result="failure"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Всплеск неудачных логинов (возможный брутфорс)"
          description: "> 1 неудачного входа в секунду последние 10 минут."

      - alert: VerificationEmailDeliveryFailing
        expr: increase(pravoos_email_verification_total{result="failed"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Письма подтверждения почты не отправляются"
          description: "За 10 минут были провалы отправки verification-писем через Resend — пользователи не могут завершить регистрацию. Проверь RESEND_API_KEY и статус Resend."

      - alert: PasswordResetEmailDeliveryFailing
        expr: increase(pravoos_email_password_reset_total{result="failed"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Письма сброса пароля не отправляются"
          description: "За 10 минут были провалы отправки password-reset писем через Resend — пользователи не могут восстановить доступ. Проверь RESEND_API_KEY и статус Resend."

      - alert: HighHeapUsage
        expr: sum by (service) (jvm_memory_used_bytes{area="heap"}) / sum by (service) (jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Heap > 90% в {{ $labels.service }}"
          description: "Использование heap выше 90% последние 10 минут — риск OOM."

      - alert: KafkaConsumerLag
        expr: max by (service, client_id) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Отставание Kafka-консьюмера в {{ $labels.service }}"
          description: "Лаг консьюмера {{ $labels.client_id }} > 1000 сообщений последние 10 минут — консьюмер не успевает обрабатывать."

  - name: pravoos-security
    rules:
      - alert: AccountLockoutSpike
        expr: sum(rate(pravoos_login_total{result="locked"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Всплеск блокировок аккаунтов"
          description: "LoginAttemptService блокирует входы чаще 0.2/с последние 10 минут — целевой перебор паролей либо намеренная блокировка чужих аккаунтов. Смотри login_lock_ip:* в Redis, чтобы отделить один источник от распределённого."

      - alert: AuthorizationFailureSpike
        expr: sum by (service) (rate(http_server_requests_seconds_count{status="403"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Всплеск отказов авторизации в {{ $labels.service }}"
          description: "> 1 ответа 403 в секунду последние 10 минут. Это перебор чужих идентификаторов (IDOR) либо сломанный релиз фронта. Сверь с access-audit, чей аккаунт и какие entityId."

      - alert: UnauthenticatedRequestSpike
        expr: sum(rate(http_server_requests_seconds_count{service="api-gateway",status="401"}[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Всплеск 401 на шлюзе"
          description: "> 5 неаутентифицированных запросов в секунду последние 10 минут — подбор или переигрывание токенов на периметре."

      - alert: OutboxEventsParked
        expr: pravoos_outbox_parked > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Outbox-события запаркованы в {{ $labels.service }}"
          description: "{{ $value }} событий исчерпали app.outbox.max-attempts и больше не будут опубликованы — потребители их никогда не увидят. Нужен ручной разбор таблицы outbox_events."

      - alert: AiWriteProposalSpike
        expr: sum(rate(pravoos_agent_proposals_total{status="created"}[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AI-агент предлагает записи необычно часто"
          description: "> 0.5 предложений записи в секунду последние 10 минут. Проверь, не зациклился ли агент и не идёт ли prompt injection через документы или почту."

      - alert: LegalDomainGuardFailingOpen
        expr: increase(pravoos_guard_total{result="allow_failopen"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "LegalDomainGuard пропускает запросы без проверки"
          description: "За 15 минут классификатор был недоступен и guard срабатывал fail-open — запросы вне юридического домена уходят в модель без фильтра. Проверь llm-service и дату /app/app.jar в контейнере: тихо устаревший образ уже давал этот эффект."
