global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    project: pravoos

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8081"]
        labels:
          service: user-service

  - job_name: ai-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ai-service:8082"]
        labels:
          service: ai-service

  - job_name: llm-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["llm-service:8084"]
        labels:
          service: llm-service

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8083"]
        labels:
          service: notification-service

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8090"]
        labels:
          service: api-gateway

  - job_name: discovery-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["discovery-server:8761"]
        labels:
          service: discovery-server

  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["config-server:8888"]
        labels:
          service: config-server
