version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pravoos-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: pravoos-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: pravoos_chat
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: pravoos-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pravoos-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: pravoos-user-service
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_USER_URL: jdbc:postgresql://postgres:5432/pravoos_users
      DB_USER_USERNAME: ${DB_USERNAME}
      DB_USER_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ./logs/user-service:/app/logs/user-service

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: pravoos-ai-service
    ports:
      - "8082:8082"
    env_file: .env
    environment:
      DB_AI_URL: jdbc:postgresql://postgres:5432/pravoos_ai
      DB_AI_USERNAME: ${DB_USERNAME}
      DB_AI_PASSWORD: ${DB_PASSWORD}
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - documents_data:/app/documents
      - ./logs/ai-service:/app/logs/ai-service

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: pravoos-notification-service
    ports:
      - "8083:8083"
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./logs/notification-service:/app/logs/notification-service

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: pravoos-api-gateway
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      USER_SERVICE_URL: http://user-service:8081
      AI_SERVICE_URL: http://ai-service:8082
      SERVER_IP: ${SERVER_IP:-}
      SERVER_DOMAIN: ${SERVER_DOMAIN:-}
      CORS_INCLUDE_LOCALHOST: ${CORS_INCLUDE_LOCALHOST:-true}
    depends_on:
      user-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ./logs/api-gateway:/app/logs/api-gateway

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: pravoos-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  mongo_data:
  zookeeper_data:
  documents_data:
