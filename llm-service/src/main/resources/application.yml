spring:
  application:
    name: llm-service
  config:
    import:
      - "classpath:config/pravoos-observability.yml"
      - "classpath:config/pravoos-cloud.yml"
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: 8084

llm:
  openai:
    api-key: ${OPENAI_API_KEY}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    guard-model: ${OPENAI_GUARD_MODEL:gpt-4o-mini}
    rerank-model: ${OPENAI_RERANK_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    max-tokens: ${OPENAI_MAX_TOKENS:4096}
    max-concurrent-requests: ${OPENAI_MAX_CONCURRENT_REQUESTS:20}
    acquire-timeout-ms: ${OPENAI_ACQUIRE_TIMEOUT_MS:2000}
    max-tool-argument-chars: ${OPENAI_MAX_TOOL_ARGUMENT_CHARS:32768}
  stream:
    pool-enabled: ${LLM_STREAM_POOL_ENABLED:true}

# SSE-стримы исполняются на выделенном llmStreamExecutor, а не на дефолтном
# applicationTaskExecutor с неограниченной очередью. queueCapacity = 0 + AbortPolicy:
# при заполнении пула новый стрим получает 503, а не встаёт в невидимую очередь.
# max-pool-size держим не выше llm.openai.max-concurrent-requests (Semaphore в OpenAiEngine),
# иначе потоки будут копиться на acquire. llm.stream.pool-enabled=false — аварийный откат
# на прежнее поведение (поток на запрос) без передеплоя.
async:
  llm-stream:
    core-pool-size: ${LLM_STREAM_POOL_CORE:6}
    max-pool-size: ${LLM_STREAM_POOL_MAX:16}

internal:
  callers:
    ai-service:
      secret: ${INTERNAL_SECRET_AI_TO_LLM:}
      paths:
        - /internal/llm/

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  config: classpath:logback-spring.xml
