name: Release

# On merge to main: re-verify, publish images to GHCR, deploy to staging with a
# smoke test, then (after manual approval on the production environment) deploy
# the same immutable SHA to production. Any failed smoke test auto-rolls-back on
# the target host.
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml

  publish:
    name: Build & push images to GHCR
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.meta.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute registry
        id: meta
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pravoos" >> "$GITHUB_OUTPUT"
      - name: Bake & push all images
        uses: docker/bake-action@v5
        with:
          push: true
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          TAG: latest
          SHA: ${{ github.sha }}

  deploy-staging:
    name: Deploy to staging
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ssh-deploy
        with:
          host: ${{ secrets.STAGING_HOST }}
          user: ${{ secrets.DEPLOY_SSH_USER }}
          ssh_private_key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy_path: ${{ vars.DEPLOY_PATH }}
          git_sha: ${{ github.sha }}
          image_registry: ${{ needs.publish.outputs.registry }}
          registry_username: ${{ github.actor }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          smoke_url: https://${{ vars.STAGING_DOMAIN }}

  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ssh-deploy
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          user: ${{ secrets.DEPLOY_SSH_USER }}
          ssh_private_key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy_path: ${{ vars.DEPLOY_PATH }}
          git_sha: ${{ github.sha }}
          image_registry: ${{ needs.publish.outputs.registry }}
          registry_username: ${{ github.actor }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          smoke_url: https://${{ vars.PRODUCTION_DOMAIN }}
