name: Setup backend build
description: Installs Temurin JDK 21 and restores the Maven dependency cache.

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: "21"
        cache: maven
