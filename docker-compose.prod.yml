services:
  postgres:
    restart: unless-stopped
    ports: !reset []

  mongodb:
    restart: unless-stopped
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

  kafka:
    restart: unless-stopped
    ports: !reset []
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      start_period: 120s

  discovery-server:
    restart: unless-stopped
    ports: !reset []
    healthcheck:
      start_period: 90s

  config-server:
    restart: unless-stopped
    ports: !reset []
    healthcheck:
      start_period: 90s

  user-service:
    restart: unless-stopped
    ports: !reset []
    environment:
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"

  llm-service:
    restart: unless-stopped
    ports: !reset []
    environment:
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    healthcheck:
      start_period: 120s

  ai-service:
    restart: unless-stopped
    ports: !reset []
    environment:
      DB_AI_USERNAME: ${DB_USERNAME}
      DB_AI_PASSWORD: ${DB_PASSWORD}
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      LLM_GUARD_FAIL_OPEN: "false"
    healthcheck:
      start_period: 120s

  notification-service:
    restart: unless-stopped
    ports: !reset []

  api-gateway:
    restart: unless-stopped
    ports: !reset []
    environment:
      CORS_INCLUDE_LOCALHOST: "false"
      DEPLOY_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8090/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 120s

  prometheus:
    restart: unless-stopped
    ports: !reset []

  alertmanager:
    restart: unless-stopped
    ports: !reset []

  grafana:
    restart: unless-stopped
    ports: !reset []

  tempo:
    restart: unless-stopped
    ports: !reset []

  loki:
    restart: unless-stopped
    ports: !reset []

  alloy:
    restart: unless-stopped
    ports: !reset []

  frontend:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/generated/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/cloudflare-realip.conf:/etc/nginx/conf.d/cloudflare-realip.conf:ro
      - ./docker/nginx/cloudflare-origin-pull-ca.pem:/etc/nginx/cloudflare-origin-pull-ca.pem:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      grafana:
        condition: service_started

  certbot:
    # Пин версии: latest тянет неизвестный образ на каждом обновлении сертификата.
    image: certbot/certbot:v5.7.0
    profiles: ["tools"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  certbot_conf:
  certbot_www:
