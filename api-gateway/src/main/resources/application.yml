spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cloud:
    gateway:
      routes:
        - id: user-service-auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${AUTH_RATE_REPLENISH:5}
                redis-rate-limiter.burstCapacity: ${AUTH_RATE_BURST:10}
                key-resolver: "#{@ipKeyResolver}"
        - id: user-service-billing-webhook
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/billing/webhook
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${WEBHOOK_RATE_REPLENISH:5}
                redis-rate-limiter.burstCapacity: ${WEBHOOK_RATE_BURST:20}
                key-resolver: "#{@ipKeyResolver}"
        - id: user-service-admin
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/**
          filters:
            - name: JwtAuthFilter
              args:
                requiredRole: ADMIN
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${ADMIN_RATE_REPLENISH:20}
                redis-rate-limiter.burstCapacity: ${ADMIN_RATE_BURST:40}
                key-resolver: "#{@ipKeyResolver}"
        - id: user-service-user
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/user/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${USER_RATE_REPLENISH:20}
                redis-rate-limiter.burstCapacity: ${USER_RATE_BURST:40}
                key-resolver: "#{@ipKeyResolver}"
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/ai/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${AI_RATE_REPLENISH:10}
                redis-rate-limiter.burstCapacity: ${AI_RATE_BURST:20}
                key-resolver: "#{@ipKeyResolver}"
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

deploy:
  server-ip: ${SERVER_IP:}
  server-domain: ${SERVER_DOMAIN:}

server:
  port: 8080

jwt:
  public-key: ${JWT_PUBLIC_KEY}

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  config: classpath:logback-spring.xml
