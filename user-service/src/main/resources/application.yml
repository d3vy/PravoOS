spring:
  application:
    name: user-service
  task:
    scheduling:
      pool:
        size: 2
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${DB_USER_URL:jdbc:postgresql://localhost:5432/pravoos_users}
    username: ${DB_USER_USERNAME:postgres}
    password: ${DB_USER_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: UserHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:16}
      minimum-idle: 2
      connection-timeout: 30000
      leak-detection-threshold: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: 8081

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}

app:
  auth:
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAMESITE:Strict}
    brute-force:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lockout-duration: ${LOGIN_LOCKOUT_DURATION:PT15M}
      attempt-window: ${LOGIN_ATTEMPT_WINDOW:PT15M}
      fail-open: ${LOGIN_BRUTE_FORCE_FAIL_OPEN:false}
  password-policy:
    hibp-enabled: ${PASSWORD_HIBP_ENABLED:true}
    hibp-timeout: ${PASSWORD_HIBP_TIMEOUT:PT3S}
    hibp-fail-open: ${PASSWORD_HIBP_FAIL_OPEN:true}
  billing:
    trial-plan-code: ${BILLING_TRIAL_PLAN_CODE:SOLO}
    trial-days: ${BILLING_TRIAL_DAYS:14}
    grace-days: ${BILLING_GRACE_DAYS:5}
    yookassa:
      shop-id: ${YOOKASSA_SHOP_ID:}
      secret-key: ${YOOKASSA_SECRET_KEY:}
      return-url: ${YOOKASSA_RETURN_URL:http://localhost:5173/billing}
      period-days: ${BILLING_PERIOD_DAYS:30}
      webhook-allowed-ips: ${YOOKASSA_WEBHOOK_IPS:185.71.76.0/27,185.71.77.0/27,77.75.153.0/25,77.75.156.11,77.75.156.35,77.75.154.128/25,2a02:5180::/32}
  push:
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:}
  mfa:
    issuer: ${MFA_ISSUER:PravoOS}
    admin-required: ${MFA_ADMIN_REQUIRED:true}
    challenge-ttl: ${MFA_CHALLENGE_TTL:PT5M}
    max-challenge-attempts: ${MFA_MAX_CHALLENGE_ATTEMPTS:5}

admin:
  accounts:
    - email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
    - email: ${ADMIN_EMAIL_2:}
      password: ${ADMIN_PASSWORD_2:}

test-lawyer:
  enabled: ${SEED_TEST_LAWYER:false}
  email: ${TEST_LAWYER_EMAIL:}
  password: ${TEST_LAWYER_PASSWORD:}
  full-name: ${TEST_LAWYER_NAME:Тестовый Юрист}
  specialization: ${TEST_LAWYER_SPEC:Тестирование}
  phone: ${TEST_LAWYER_PHONE:+70000000000}

internal:
  secret: ${INTERNAL_SERVICE_SECRET}

telegram:
  bot-username: ${TELEGRAM_BOT_USERNAME:}
  link-code-ttl: ${TELEGRAM_LINK_CODE_TTL:PT15M}

resend:
  api-key: ${RESEND_API_KEY}
  from: ${RESEND_FROM:onboarding@resend.dev}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  verification-expiry-hours: ${RESEND_VERIFICATION_EXPIRY_HOURS:24}
  password-reset-expiry-hours: ${RESEND_PASSWORD_RESET_EXPIRY_HOURS:1}
  max-emails-per-hour: ${RESEND_MAX_EMAILS_PER_HOUR:3}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  config: classpath:logback-spring.xml
