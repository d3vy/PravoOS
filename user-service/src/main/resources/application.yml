spring:
  application:
    name: user-service
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${DB_USER_URL:jdbc:postgresql://localhost:5432/pravoos_users}
    username: ${DB_USER_USERNAME:postgres}
    password: ${DB_USER_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}

app:
  auth:
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAMESITE:Strict}
    brute-force:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      lockout-duration: ${LOGIN_LOCKOUT_DURATION:PT15M}
      attempt-window: ${LOGIN_ATTEMPT_WINDOW:PT15M}

admin:
  accounts:
    - email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
    - email: ${ADMIN_EMAIL_2:}
      password: ${ADMIN_PASSWORD_2:}

internal:
  secret: ${INTERNAL_SERVICE_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  config: classpath:logback-spring.xml
