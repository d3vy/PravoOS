spring:
  application:
    name: ai-service
  datasource:
    url: ${DB_AI_URL:jdbc:postgresql://localhost:5432/pravoos_ai}
    username: ${DB_AI_USERNAME:postgres}
    password: ${DB_AI_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ai-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
    mongodb:
      host: ${MONGODB_HOST:mongodb}
      port: ${MONGODB_PORT:27017}
      database: pravoos_chat
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      authentication-database: admin
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8082

jwt:
  public-key: ${JWT_PUBLIC_KEY}

llm:
  openai:
    api-key: ${OPENAI_API_KEY}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    guard-model: ${OPENAI_GUARD_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    max-tokens: ${OPENAI_MAX_TOKENS:4096}

document:
  storage-path: ${DOCUMENT_STORAGE_PATH:/app/documents}
  chunk-size: 512
  chunk-overlap: 50
  top-k-results: 5

arbitr:
  api:
    base-url: ${ARBITR_API_BASE_URL:https://parser-api.com/parser/arbitr_api/details_by_number}
    key: ${ARBITR_API_KEY:}
  poll:
    cron: ${ARBITR_POLL_CRON:0 0 */6 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  config: classpath:logback-spring.xml
