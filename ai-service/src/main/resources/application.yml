spring:
  application:
    name: ai-service
  config:
    import:
      - "classpath:config/pravoos-observability.yml"
      - "classpath:config/pravoos-cloud.yml"
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: ${DB_AI_URL:jdbc:postgresql://localhost:5432/pravoos_ai}
    username: ${DB_AI_USERNAME:postgres}
    password: ${DB_AI_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AiHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:16}
      minimum-idle: 2
      connection-timeout: 30000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ai-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
    mongodb:
      host: ${MONGODB_HOST:mongodb}
      port: ${MONGODB_PORT:27017}
      database: pravoos_chat
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      authentication-database: admin
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8082

jwt:
  public-key: ${JWT_PUBLIC_KEY}

llm:
  service:
    base-url: ${LLM_SERVICE_BASE_URL:http://localhost:8084}
    internal-secret: ${INTERNAL_SERVICE_SECRET}
    embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
  quota:
    daily-requests: ${LLM_DAILY_QUOTA:200}
    daily-tokens: ${LLM_DAILY_TOKEN_BUDGET:0}
  guard:
    fail-open: ${LLM_GUARD_FAIL_OPEN:true}
  history-max-chars: ${LLM_HISTORY_MAX_CHARS:12000}

chat:
  retention-days: ${CHAT_RETENTION_DAYS:0}

contract-review:
  max-input-chars: ${CONTRACT_REVIEW_MAX_INPUT_CHARS:40000}
  max-findings: ${CONTRACT_REVIEW_MAX_FINDINGS:30}

document-comparison:
  max-input-chars: ${DOCUMENT_COMPARISON_MAX_INPUT_CHARS:40000}
  max-changes: ${DOCUMENT_COMPARISON_MAX_CHANGES:40}
  change-max-chars: ${DOCUMENT_COMPARISON_CHANGE_MAX_CHARS:1500}

tabular-review:
  max-documents: ${TABULAR_REVIEW_MAX_DOCUMENTS:15}
  max-questions: ${TABULAR_REVIEW_MAX_QUESTIONS:8}
  top-k-per-question: ${TABULAR_REVIEW_TOP_K:4}
  context-max-chars: ${TABULAR_REVIEW_CONTEXT_MAX_CHARS:20000}
  answer-max-chars: ${TABULAR_REVIEW_ANSWER_MAX_CHARS:600}
  quote-max-chars: ${TABULAR_REVIEW_QUOTE_MAX_CHARS:1200}

citation-check:
  max-citations: ${CITATION_CHECK_MAX_CITATIONS:100}
  max-court-case-lookups: ${CITATION_CHECK_MAX_COURT_LOOKUPS:25}

draft-editing:
  max-content-chars: ${DRAFT_EDITING_MAX_CONTENT_CHARS:60000}
  max-refine-chars: ${DRAFT_EDITING_MAX_REFINE_CHARS:20000}

document:
  storage-path: ${DOCUMENT_STORAGE_PATH:/app/documents}
  chunk-size: 512
  chunk-overlap: 50
  top-k-results: 5
  context-max-chars: ${RAG_CONTEXT_MAX_CHARS:24000}
  max-per-case: ${DOCUMENT_MAX_PER_CASE:200}
  max-per-lawyer: ${DOCUMENT_MAX_PER_LAWYER:2000}
  max-total-bytes-per-lawyer: ${DOCUMENT_MAX_TOTAL_BYTES_PER_LAWYER:5368709120}
  upload-rate-per-minute: ${DOCUMENT_UPLOAD_RATE_PER_MINUTE:20}
  search:
    lexical-enabled: ${RAG_LEXICAL_ENABLED:true}
    max-distance: ${RAG_MAX_DISTANCE:0.85}
    candidate-multiplier: ${RAG_CANDIDATE_MULTIPLIER:6}
    max-candidates: ${RAG_MAX_CANDIDATES:60}
    rrf-k: ${RAG_RRF_K:60}
    vector-weight: ${RAG_VECTOR_WEIGHT:1.0}
    lexical-weight: ${RAG_LEXICAL_WEIGHT:0.7}
    legislation-boost: ${RAG_LEGISLATION_BOOST:0.005}
    rerank:
      enabled: ${RAG_RERANK_ENABLED:true}
      top-n: ${RAG_RERANK_TOP_N:20}
      max-chars-per-candidate: ${RAG_RERANK_MAX_CHARS:700}
      max-tokens: ${RAG_RERANK_MAX_TOKENS:400}
      fail-open: ${RAG_RERANK_FAIL_OPEN:true}
  crypto:
    key: ${FILE_ENCRYPTION_KEY:}
  malware-scan:
    host: ${CLAMAV_HOST:}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: ${CLAMAV_TIMEOUT_MS:15000}
    fail-open: ${CLAMAV_FAIL_OPEN:false}
    max-signature-age-days: ${CLAMAV_MAX_SIGNATURE_AGE_DAYS:7}
    signature-check-initial-delay: ${CLAMAV_SIGNATURE_CHECK_INITIAL_DELAY:PT2M}
    signature-check-interval: ${CLAMAV_SIGNATURE_CHECK_INTERVAL:PT1H}
  upload-guard:
    max-file-bytes: ${DOCUMENT_MAX_FILE_BYTES:52428800}
    max-uncompressed-bytes: ${DOCUMENT_MAX_UNCOMPRESSED_BYTES:536870912}
    max-compression-ratio: ${DOCUMENT_MAX_COMPRESSION_RATIO:200}
    max-archive-entries: ${DOCUMENT_MAX_ARCHIVE_ENTRIES:2000}
    block-active-content: ${DOCUMENT_BLOCK_ACTIVE_CONTENT:true}

pii:
  crypto:
    key: ${PII_ENCRYPTION_KEY:}

pdn:
  consent:
    current-version: ${PDN_CONSENT_VERSION:1.0}

arbitr:
  api:
    base-url: ${ARBITR_API_BASE_URL:https://parser-api.com/parser/arbitr_api/details_by_number}
    key: ${ARBITR_API_KEY:}
  poll:
    cron: ${ARBITR_POLL_CRON:0 0 */6 * * *}

signature:
  default-expiry-days: ${SIGNATURE_EXPIRY_DAYS:30}
  expiry:
    cron: ${SIGNATURE_EXPIRY_CRON:0 25 3 * * *}
  diadoc:
    base-url: ${DIADOC_API_BASE_URL:https://diadoc-api.kontur.ru}
    api-key: ${DIADOC_API_KEY:}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}
  internal-secret: ${INTERNAL_SERVICE_SECRET:}

logging:
  config: classpath:logback-spring.xml
