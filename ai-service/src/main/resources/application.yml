spring:
  application:
    name: ai-service
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: ${DB_AI_URL:jdbc:postgresql://localhost:5432/pravoos_ai}
    username: ${DB_AI_USERNAME:postgres}
    password: ${DB_AI_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AiHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:16}
      minimum-idle: 2
      connection-timeout: 30000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ai-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
    mongodb:
      host: ${MONGODB_HOST:mongodb}
      port: ${MONGODB_PORT:27017}
      database: pravoos_chat
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      authentication-database: admin
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8082

jwt:
  public-key: ${JWT_PUBLIC_KEY}

llm:
  openai:
    api-key: ${OPENAI_API_KEY}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    guard-model: ${OPENAI_GUARD_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    max-tokens: ${OPENAI_MAX_TOKENS:4096}
  quota:
    daily-requests: ${LLM_DAILY_QUOTA:200}
    daily-tokens: ${LLM_DAILY_TOKEN_BUDGET:0}
  guard:
    fail-open: ${LLM_GUARD_FAIL_OPEN:true}
  history-max-chars: ${LLM_HISTORY_MAX_CHARS:12000}

chat:
  retention-days: ${CHAT_RETENTION_DAYS:0}

document:
  storage-path: ${DOCUMENT_STORAGE_PATH:/app/documents}
  chunk-size: 512
  chunk-overlap: 50
  top-k-results: 5
  context-max-chars: ${RAG_CONTEXT_MAX_CHARS:24000}
  max-distance: ${RAG_MAX_DISTANCE:0.85}
  max-per-case: ${DOCUMENT_MAX_PER_CASE:200}

arbitr:
  api:
    base-url: ${ARBITR_API_BASE_URL:https://parser-api.com/parser/arbitr_api/details_by_number}
    key: ${ARBITR_API_KEY:}
  poll:
    cron: ${ARBITR_POLL_CRON:0 0 */6 * * *}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  config: classpath:logback-spring.xml
