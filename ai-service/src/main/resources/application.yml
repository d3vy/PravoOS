spring:
  application:
    name: ai-service
  config:
    import:
      - "classpath:config/pravoos-observability.yml"
      - "classpath:config/pravoos-cloud.yml"
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: ${DB_AI_URL:jdbc:postgresql://localhost:5432/pravoos_ai}
    username: ${DB_AI_USERNAME:postgres}
    password: ${DB_AI_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AiHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:16}
      minimum-idle: 2
      connection-timeout: 30000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ai-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
    mongodb:
      host: ${MONGODB_HOST:mongodb}
      port: ${MONGODB_PORT:27017}
      database: pravoos_chat
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      authentication-database: admin
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8082

jwt:
  public-key: ${JWT_PUBLIC_KEY}

llm:
  service:
    base-url: ${LLM_SERVICE_BASE_URL:http://localhost:8084}
    internal-secret: ${INTERNAL_SECRET_AI_TO_LLM}
    embedding-dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
  quota:
    daily-requests: ${LLM_DAILY_QUOTA:200}
    daily-tokens: ${LLM_DAILY_TOKEN_BUDGET:0}
  guard:
    fail-open: ${LLM_GUARD_FAIL_OPEN:true}
  history-max-chars: ${LLM_HISTORY_MAX_CHARS:12000}
  context-parallel-enabled: ${LLM_CONTEXT_PARALLEL_ENABLED:true}

chat:
  retention-days: ${CHAT_RETENTION_DAYS:0}

contract-review:
  max-input-chars: ${CONTRACT_REVIEW_MAX_INPUT_CHARS:40000}
  max-findings: ${CONTRACT_REVIEW_MAX_FINDINGS:30}

document-comparison:
  max-input-chars: ${DOCUMENT_COMPARISON_MAX_INPUT_CHARS:40000}
  max-changes: ${DOCUMENT_COMPARISON_MAX_CHANGES:40}
  change-max-chars: ${DOCUMENT_COMPARISON_CHANGE_MAX_CHARS:1500}

tabular-review:
  max-documents: ${TABULAR_REVIEW_MAX_DOCUMENTS:15}
  max-questions: ${TABULAR_REVIEW_MAX_QUESTIONS:8}
  top-k-per-question: ${TABULAR_REVIEW_TOP_K:4}
  context-max-chars: ${TABULAR_REVIEW_CONTEXT_MAX_CHARS:20000}
  answer-max-chars: ${TABULAR_REVIEW_ANSWER_MAX_CHARS:600}
  quote-max-chars: ${TABULAR_REVIEW_QUOTE_MAX_CHARS:1200}

citation-check:
  max-citations: ${CITATION_CHECK_MAX_CITATIONS:100}
  max-court-case-lookups: ${CITATION_CHECK_MAX_COURT_LOOKUPS:25}

draft-editing:
  max-content-chars: ${DRAFT_EDITING_MAX_CONTENT_CHARS:60000}
  max-refine-chars: ${DRAFT_EDITING_MAX_REFINE_CHARS:20000}

agent:
  max-iterations: ${AGENT_MAX_ITERATIONS:8}
  max-tool-calls: ${AGENT_MAX_TOOL_CALLS:12}
  max-result-chars: ${AGENT_MAX_RESULT_CHARS:8000}
  max-arguments-chars: ${AGENT_MAX_ARGUMENTS_CHARS:8000}
  max-duration: ${AGENT_MAX_DURATION:PT120S}
  max-total-tokens: ${AGENT_MAX_TOTAL_TOKENS:120000}
  proposal-ttl: ${AGENT_PROPOSAL_TTL:PT30M}
  max-write-actions-per-hour: ${AGENT_MAX_WRITE_ACTIONS_PER_HOUR:30}
  proposal-expiry-cron: ${AGENT_PROPOSAL_EXPIRY_CRON:0 */5 * * * *}

recycle-bin:
  enabled: ${RECYCLE_BIN_ENABLED:true}
  retention: ${RECYCLE_BIN_RETENTION:P7D}
  purge:
    cron: ${RECYCLE_BIN_PURGE_CRON:0 30 3 * * *}
    batch-size: ${RECYCLE_BIN_PURGE_BATCH:100}

document:
  storage-path: ${DOCUMENT_STORAGE_PATH:/app/documents}
  chunk-size: 512
  chunk-overlap: 50
  top-k-results: 5
  context-max-chars: ${RAG_CONTEXT_MAX_CHARS:24000}
  max-per-case: ${DOCUMENT_MAX_PER_CASE:200}
  max-per-lawyer: ${DOCUMENT_MAX_PER_LAWYER:2000}
  max-total-bytes-per-lawyer: ${DOCUMENT_MAX_TOTAL_BYTES_PER_LAWYER:5368709120}
  upload-rate-per-minute: ${DOCUMENT_UPLOAD_RATE_PER_MINUTE:20}
  summary:
    enabled: ${DOCUMENT_SUMMARY_ENABLED:true}
    max-input-chars: ${DOCUMENT_SUMMARY_MAX_INPUT_CHARS:24000}
    max-key-points: ${DOCUMENT_SUMMARY_MAX_KEY_POINTS:7}
    max-summary-chars: ${DOCUMENT_SUMMARY_MAX_CHARS:1500}
    max-key-point-chars: ${DOCUMENT_SUMMARY_MAX_KEY_POINT_CHARS:400}
    max-tokens: ${DOCUMENT_SUMMARY_MAX_TOKENS:900}
  search:
    lexical-enabled: ${RAG_LEXICAL_ENABLED:true}
    parallel-enabled: ${RAG_PARALLEL_ENABLED:true}
    max-distance: ${RAG_MAX_DISTANCE:0.85}
    candidate-multiplier: ${RAG_CANDIDATE_MULTIPLIER:6}
    max-candidates: ${RAG_MAX_CANDIDATES:60}
    rrf-k: ${RAG_RRF_K:60}
    vector-weight: ${RAG_VECTOR_WEIGHT:1.0}
    lexical-weight: ${RAG_LEXICAL_WEIGHT:0.7}
    legislation-boost: ${RAG_LEGISLATION_BOOST:0.005}
    rerank:
      enabled: ${RAG_RERANK_ENABLED:true}
      top-n: ${RAG_RERANK_TOP_N:20}
      max-chars-per-candidate: ${RAG_RERANK_MAX_CHARS:700}
      max-tokens: ${RAG_RERANK_MAX_TOKENS:400}
      fail-open: ${RAG_RERANK_FAIL_OPEN:true}
  crypto:
    key: ${FILE_ENCRYPTION_KEY:}
  malware-scan:
    host: ${CLAMAV_HOST:}
    port: ${CLAMAV_PORT:3310}
    timeout-ms: ${CLAMAV_TIMEOUT_MS:15000}
    fail-open: ${CLAMAV_FAIL_OPEN:false}
    max-signature-age-days: ${CLAMAV_MAX_SIGNATURE_AGE_DAYS:7}
    signature-check-initial-delay: ${CLAMAV_SIGNATURE_CHECK_INITIAL_DELAY:PT2M}
    signature-check-interval: ${CLAMAV_SIGNATURE_CHECK_INTERVAL:PT1H}
  upload-guard:
    max-file-bytes: ${DOCUMENT_MAX_FILE_BYTES:52428800}
    max-uncompressed-bytes: ${DOCUMENT_MAX_UNCOMPRESSED_BYTES:536870912}
    max-compression-ratio: ${DOCUMENT_MAX_COMPRESSION_RATIO:200}
    max-archive-entries: ${DOCUMENT_MAX_ARCHIVE_ENTRIES:2000}
    block-active-content: ${DOCUMENT_BLOCK_ACTIVE_CONTENT:true}

pii:
  crypto:
    required: ${PII_ENCRYPTION_REQUIRED:false}
    active-key-id: ${PII_ACTIVE_KEY_ID:}
    key: ${PII_ENCRYPTION_KEY:}
    backfill-on-start: ${PII_BACKFILL_ON_START:false}

pdn:
  consent:
    current-version: ${PDN_CONSENT_VERSION:1.0}

arbitr:
  api:
    base-url: ${ARBITR_API_BASE_URL:https://parser-api.com/parser/arbitr_api/details_by_number}
    key: ${ARBITR_API_KEY:}

court:
  poll:
    cron: ${COURT_POLL_CRON:${ARBITR_POLL_CRON:0 0 */6 * * *}}

mailbox:
  imap:
    connect-timeout: ${MAILBOX_IMAP_CONNECT_TIMEOUT:10s}
    read-timeout: ${MAILBOX_IMAP_READ_TIMEOUT:30s}
    max-per-user: ${MAILBOX_MAX_PER_USER:5}
  sync:
    cron: ${MAILBOX_SYNC_CRON:0 */10 * * * *}
    max-messages-per-run: ${MAILBOX_SYNC_MAX_MESSAGES:100}
    max-body-length: ${MAILBOX_SYNC_MAX_BODY_LENGTH:100000}
    max-auto-link-backlog: ${MAILBOX_SYNC_MAX_AUTO_LINK_BACKLOG:500}
  attachments:
    max-per-message: ${MAILBOX_ATTACHMENT_MAX_PER_MESSAGE:10}
    max-bytes: ${MAILBOX_ATTACHMENT_MAX_BYTES:26214400}

signature:
  default-expiry-days: ${SIGNATURE_EXPIRY_DAYS:30}
  expiry:
    cron: ${SIGNATURE_EXPIRY_CRON:0 25 3 * * *}
  diadoc:
    base-url: ${DIADOC_API_BASE_URL:https://diadoc-api.kontur.ru}
    api-key: ${DIADOC_API_KEY:}
  cms:
    trusted-ca-path: ${SIGNATURE_TRUSTED_CA_PATH:}

invoice:
  overdue:
    reminder:
      cron: ${INVOICE_OVERDUE_REMINDER_CRON:0 0 9 * * *}

search:
  parallel-enabled: ${SEARCH_PARALLEL_ENABLED:true}

dashboard:
  parallel-enabled: ${DASHBOARD_PARALLEL_ENABLED:true}

lawyer:
  digest:
    morning:
      cron: ${LAWYER_DIGEST_MORNING_CRON:0 0 8 * * *}

app:
  billing:
    yookassa:
      shop-id: ${YOOKASSA_SHOP_ID:}
      secret-key: ${YOOKASSA_SECRET_KEY:}
      return-url: ${YOOKASSA_INVOICE_RETURN_URL:http://localhost:5173/portal/invoices}
      webhook-allowed-ips: ${YOOKASSA_WEBHOOK_IPS:185.71.76.0/27,185.71.77.0/27,77.75.153.0/25,77.75.156.11,77.75.156.35,77.75.154.128/25,2a02:5180::/32}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}
  internal-secret: ${INTERNAL_SECRET_AI_SERVICE}

logging:
  config: classpath:logback-spring.xml
